name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic test constant, never a real key: the fake vendor stands in for the model provider.
  SECRETS_MASTER_KEY: "1111111111111111111111111111111111111111111111111111111111111111"

jobs:
  # Three independent runners collect one disjoint native-Vitest shard each. Only the
  # official aggregate below may claim repository-wide coverage or required-group proof.
  test-main:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.0.26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - name: Create isolated main test database
        run: mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE agent_service_test_main CHARACTER SET utf8mb4;"
      - name: Attest this job's disposable MySQL service before authority tests
        env:
          MYSQL_TEST_SERVICE_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test_main
        run: node scripts/ci-owned-mysql-authority.mjs
      - name: Collect native main coverage shard (global coverage gate pending)
        env:
          AGENT_SERVICE_INTEGRATION: "1"
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test_main
          REDIS_TEST_URL: redis://127.0.0.1:6379/1
        run: |
          node scripts/run-main-coverage-shard.mjs --shard ${{ matrix.shard }} --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-commit "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/main-coverage-shard-${{ matrix.shard }}"
      - name: Preserve original main shard evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-coverage-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-main-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ always() }}
    needs: [test-main]
    steps:
      - name: Require every main shard to succeed
        env:
          MAIN_SHARDS_RESULT: ${{ needs.test-main.result }}
        run: test "$MAIN_SHARDS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download original main shard 1
        uses: actions/download-artifact@v4
        with:
          name: main-coverage-shard-1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-inputs/main-coverage-shard-1
      - name: Download original main shard 2
        uses: actions/download-artifact@v4
        with:
          name: main-coverage-shard-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-inputs/main-coverage-shard-2
      - name: Download original main shard 3
        uses: actions/download-artifact@v4
        with:
          name: main-coverage-shard-3-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-inputs/main-coverage-shard-3
      - name: Official native report and V8 coverage merge with original global and implementation gates
        run: |
          node scripts/merge-main-coverage.mjs --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-commit "$GITHUB_SHA" --artifacts-dir "$RUNNER_TEMP/main-coverage-inputs" --output-dir "$RUNNER_TEMP/main-coverage-aggregate"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-aggregate/coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve merged main execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-coverage-proof-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/main-coverage-aggregate/tests.json
            ${{ runner.temp }}/main-coverage-aggregate/proof.json
            ${{ runner.temp }}/main-coverage-aggregate/discovery.json
          if-no-files-found: error
          retention-days: 7

  test-runtime:
    runs-on: ubuntu-latest
    # All original process/S3/build/VM gates keep serial resource ownership on this runner.
    # Main and historical shards own separate service instances; no schema or Redis is shared.
    timeout-minutes: 180
    env:
      MINIO_SOURCE_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    services:
      mysql:
        # Pin the supported floor here; the image job below deliberately keeps the moving 8.0 tag
        # so CI proves both oldest-supported migration SQL and current 8.0 image compatibility.
        image: mysql:8.0.26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          # Frozen 0038, 0039 and 0040 binary fixtures archive exact published commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.8
          cache: false
      - name: Build and start real MinIO from the pinned official commit
        env:
          # Deterministic CI-only values scoped to the MinIO process launched by this step.
          MINIO_ROOT_USER: agentservice-ci
          MINIO_ROOT_PASSWORD: agent-service-ci-minio-only-0001
        run: |
          mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
          GOTOOLCHAIN=local GOBIN="$RUNNER_TEMP/minio-bin" \
            go install "github.com/minio/minio@$MINIO_SOURCE_COMMIT"
          nohup "$RUNNER_TEMP/minio-bin/minio" --quiet --anonymous server \
            "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 >"$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/minio.pid"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$i" = "90" ]; then echo "MinIO did not become ready"; exit 1; fi
            sleep 1
          done
      - name: Bootstrap distinct logical private un-versioned MinIO buckets
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: |
          node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-restore-journal \
            node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-backup-catalog \
            node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-tenant-telemetry \
            node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-telemetry-disposition \
            node packages/store/scripts/bootstrap-s3.mjs

      - name: Verify OpenAPI and generated SDK are current
        run: pnpm run check:api

      - name: Typecheck (sources and tests)
        run: pnpm typecheck

      - name: Create test databases
        run: |
          mysql -h 127.0.0.1 -uroot -e "
            CREATE DATABASE IF NOT EXISTS agent_service_test CHARACTER SET utf8mb4;
            CREATE DATABASE IF NOT EXISTS agent_service_cluster CHARACTER SET utf8mb4;"

      # Keep the existing process gates ahead of the long coverage/S3 matrix so a cluster
      # regression fails early. Their separate MySQL schema/Redis DB and all assertions stay intact.
      - name: Cluster tests (real processes)
        env:
          AGENT_SERVICE_CLUSTER: "1"
          CLUSTER_MYSQL_URL: mysql://root@127.0.0.1:3306/agent_service_cluster
          CLUSTER_REDIS_URL: redis://127.0.0.1:6379/3
        run: pnpm vitest run test/cluster

      # Parse an exact JSON report in addition to the broad cluster run. This proves the T3g
      # mixed-worker, mixed-namespace and active-fleet rollout matrix ran with zero skipped cases.
      - name: Tenant Redis purge cluster rollout suite (must execute)
        env:
          CLUSTER_MYSQL_URL: mysql://root@127.0.0.1:3306/agent_service_cluster
          CLUSTER_REDIS_URL: redis://127.0.0.1:6379/3
        run: pnpm run test:tenant-redis-purge-cluster

      # These profiles need dedicated flags/services and cannot be replaced by the main report.
      - name: Blob S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:blob-s3

      - name: Managed skills shared MySQL and MinIO vertical (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:skills-s3

      # Use a distinct bucket to prove namespace and credential wiring isolation from BlobStore.
      # One local MinIO process is only a protocol/fault simulation, not proof of a physically
      # independent production failure domain. The suite exercises concurrent immutable appends,
      # exact response-loss inspection and sealed-prefix replay.
      - name: Restore journal S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_RESTORE_JOURNAL_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:restore-journal-s3

      # Use a third bucket so the catalog protocol cannot accidentally share the Blob data plane
      # or restore-journal namespace. Local MinIO proves protocol/fault handling only; it is not an
      # independent production failure domain.
      - name: Backup catalog S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_BACKUP_CATALOG_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:backup-catalog-s3

      # Use a fourth bucket so managed telemetry artifacts cannot share the Blob, restore-journal,
      # or backup-catalog namespace. This proves the S3 protocol against real MinIO only; it does
      # not prove a physically independent production failure domain, IAM policy, or managed sink.
      - name: Tenant telemetry writer S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_TENANT_TELEMETRY_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:tenant-telemetry-writer-s3

      # The fixture drives original provider HTTP/stream failure through PiEngine/SessionHost,
      # real MySQL failed-step commit and the existing worker into actual MinIO bytes/ACK.
      # It proves local capture only: sixth-source erasure/grant remain hard denied.
      - name: Persisted provider failure capture real MySQL and MinIO E2E (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_FORCE_PATH_STYLE: "1"
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
        run: pnpm run test:telemetry-capture-mysql-s3

      # The fifth logical bucket exercises v1 fixture CAS, the v2 journal observer, and
      # the 0046 artifact observer under separate random prefixes and required no-skip files.
      # Same-host MinIO does not prove a production fault domain or a DB grant.
      - name: Tenant telemetry disposition S3 and v2 read-only observer real MinIO suites (must execute)
        env:
          AGENT_SERVICE_TELEMETRY_DISPOSITION_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TELEMETRY_DISPOSITION_TEST_BUCKET: agent-service-ci-telemetry-disposition
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:tenant-telemetry-disposition-s3

      # Non-production protocol substrate only: no DB grant, product delete or physical ACK.
      - name: Tenant telemetry disposition v3 journal real MinIO suite (must execute)
        env:
          AGENT_SERVICE_TELEMETRY_DISPOSITION_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TELEMETRY_DISPOSITION_TEST_BUCKET: agent-service-ci-telemetry-disposition
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: |
          pnpm run test:tenant-telemetry-disposition-journal-v3-s3
          pnpm run test:tenant-telemetry-disposition-journal-v3-observer-s3

      # Read real writer bytes in the fourth bucket, and fixture markers in the fifth;
      # both use separate random prefixes and the observer itself issues GET only.
      - name: Tenant telemetry artifact GET-only observer real MinIO suite (must execute)
        env:
          AGENT_SERVICE_TELEMETRY_DISPOSITION_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TELEMETRY_DISPOSITION_TEST_BUCKET: agent-service-ci-telemetry-disposition
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:tenant-telemetry-artifact-observer-s3

      # Exercise the actual one-shot CLI across both durability systems. The fixture creates a
      # random disposable database and S3 prefix, proves paged/exact replay and complete external
      # chain mirroring, and verifies that only the selected backup without an exact local anchor
      # remains ineligible for restore while later content-free events continue to project.
      - name: Backup catalog reconcile real MySQL + MinIO suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:backup-catalog-reconcile-mysql-s3

      # Restore an actual mysqldump image that predates two external availability events and one
      # reservation. The required fixture proves the same 0031 operation reconstructs its local
      # authority before ordinary 0030 replay may seal and activate the restored runtime.
      - name: Verify trusted host MySQL 8 artifact tools
        run: |
          mysql_binary="$(command -v mysql)"
          mysqldump_binary="$(command -v mysqldump)"
          [[ "$mysql_binary" = /* && -x "$mysql_binary" ]]
          [[ "$mysqldump_binary" = /* && -x "$mysqldump_binary" ]]
          "$mysql_binary" --no-defaults --version | grep -Eq 'Ver 8[.]|Distrib 8[.]'
          "$mysqldump_binary" --no-defaults --version | grep -Eq 'Ver 8[.]|Distrib 8[.]'
          echo "BACKUP_MYSQL_BINARY=$mysql_binary" >> "$GITHUB_ENV"
          echo "BACKUP_MYSQLDUMP_BINARY=$mysqldump_binary" >> "$GITHUB_ENV"
          echo "Trusted host MySQL 8 tools verified; runner image does not include these tools"

      - name: Backup catalog old-snapshot restore roundtrip (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:backup-catalog-restore-roundtrip-mysql-s3

      # This invokes the actual producer and encrypted-byte verifier, then imports only to
      # disposable empty databases. Its independent required-suite report rejects skips/zero tests.
      - name: MySQL encrypted backup artifact real MySQL + MinIO suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:mysql-backup-artifact-mysql-s3

      - name: Capture new-epoch encrypted restore with real HTTP fleet + MySQL + MinIO (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:telemetry-capture-restore-mysql-s3

      # The offline mover crosses both InnoDB and object-storage durability boundaries. Keep a
      # named proof with a fresh database and namespace per case; the wrapper rejects skips/zero tests.
      - name: Blob migration real MySQL + MinIO suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:blob-storage-migration-mysql-s3

      - name: Build distributable artifacts and boot plain Node bundles
        run: pnpm run build:check

      - name: Build independent VM role packages and boot with plain Node (no external services)
        run: pnpm run check:vm-release --artifacts "$RUNNER_TEMP/agent-service-vm-releases"

      # The trusted job log publishes all three raw digests; a sidecar alone is not authority.
      # These are target-bound candidates, not signed production deployments or cloud resources.
      - name: Preserve verified Node 24 VM transport candidates
        uses: actions/upload-artifact@v4
        with:
          name: vm-process-releases-linux-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-service-vm-releases/
          if-no-files-found: error
          retention-days: 14

      # Keep a separate, named proof that the runner's one-shot mover artifact exists and executes
      # under plain Node. build:check also runs this gate so local verification cannot omit it.
      - name: Runner Blob migration distributable CLI (must execute)
        run: pnpm run check:blob-storage-migrate-artifact

      - name: Runner restore-ledger reconciliation distributable CLI (must execute)
        run: pnpm run check:restore-ledger-reconcile-artifact

      - name: Runner telemetry capture distributable CLI (must execute)
        run: pnpm run check:telemetry-capture-artifact

      - name: Runner authoritative backup catalog distributable CLI (must execute)
        run: pnpm run check:backup-catalog-artifact

      # Start the production-shaped bundles against a throwaway MySQL schema and the real MinIO
      # process above. This proves the bundled AWS SDK closure, migration 0027 storage control,
      # migration 0028 mover ledger and exact fleet namespace negotiation at the application wiring
      # boundary; object-store credentials are scoped to this step and passed only to the runner.
      - name: S3 bundled runner/router application assembly smoke (must execute)
        env:
          AGENT_SERVICE_APP_SMOKE_MODE: dist
          MYSQL_APP_SMOKE_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:app-s3-smoke

  # Historical files retain their original ordered manifest and individual case budgets.
  # Each native shard owns a separate MySQL runner; aggregate validates their exact raw union.
  test-history-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.0.26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - name: Create isolated historical test database
        run: mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE agent_service_test_history CHARACTER SET utf8mb4;"
      - name: Historical MySQL migration shard (all assigned files, no skips)
        env:
          MYSQL_MIGRATION_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test_history
        run: node scripts/run-migration-shard.mjs --shard ${{ matrix.shard }}/3
      - name: Preserve original historical shard evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .local-run/migration-shards/${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ always() }}
    needs: [test-history-shard]
    steps:
      - name: Require every historical shard to succeed
        env:
          HISTORY_SHARDS_RESULT: ${{ needs.test-history-shard.result }}
        run: test "$HISTORY_SHARDS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download original historical shard 1
        uses: actions/download-artifact@v4
        with:
          name: migration-shard-1-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.local-run/migration-shards/1
      - name: Download original historical shard 2
        uses: actions/download-artifact@v4
        with:
          name: migration-shard-2-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.local-run/migration-shards/2
      - name: Download original historical shard 3
        uses: actions/download-artifact@v4
        with:
          name: migration-shard-3-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.local-run/migration-shards/3
      - name: Verify exact current historical manifest and zero-skip union
        run: node scripts/merge-migration-shards.mjs --input-dir "$GITHUB_WORKSPACE/.local-run/migration-shards"
      - name: Preserve historical execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-migration-proof-attempt-${{ github.run_attempt }}
          path: |
            .local-run/migration-shards/1/tests.json
            .local-run/migration-shards/1/metadata.json
            .local-run/migration-shards/2/tests.json
            .local-run/migration-shards/2/metadata.json
            .local-run/migration-shards/3/tests.json
            .local-run/migration-shards/3/metadata.json
            .local-run/migration-aggregate-${{ github.run_id }}-${{ github.run_attempt }}/aggregate-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Preserve the stable core check only when both the exact native coverage aggregate and
  # every original runtime/S3/distribution gate actually succeeded. Skips/cancels are failures.
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [test-main-merge, test-runtime]
    steps:
      - name: Require main coverage and every runtime gate to succeed
        env:
          MAIN_MERGE_RESULT: ${{ needs.test-main-merge.result }}
          RUNTIME_RESULT: ${{ needs.test-runtime.result }}
        run: |
          set -euo pipefail
          test "$MAIN_MERGE_RESULT" = success
          test "$RUNTIME_RESULT" = success

  # The production image is part of the contract, so it is built and started here. Every one of the
  # Dockerfile defects found in review was invisible precisely because CI never did this.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [agent-runner, agent-router]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service_test_image_base
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP=${{ matrix.app }}
          tags: agent-service/${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Syntax-only native acceptance of the checked-in single-Linux deployment samples.
      # The isolated fixture is never a deployment or a real systemd/cgroup/TLS/alert proof.
      - name: Verify production samples with native Linux configuration tools
        if: matrix.app == 'agent-runner'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY_NATIVE_SAMPLES'
          import datetime, hashlib, json, os, pathlib, re, shutil, signal, subprocess, tempfile, time

          ROOT = pathlib.Path.cwd().resolve()
          TEMP = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          RUN = os.environ['GITHUB_RUN_ID']
          ATTEMPT = os.environ['GITHUB_RUN_ATTEMPT']
          COMMIT = os.environ['GITHUB_SHA']
          if not (re.fullmatch(r'[0-9]+', RUN) and re.fullmatch(r'[0-9]+', ATTEMPT)
                  and re.fullmatch(r'[0-9a-f]{40}', COMMIT)):
              raise SystemExit('invalid trusted CI identity')
          PROOF = TEMP / ('production-samples-native-' + RUN + '-' + ATTEMPT)
          PROOF.mkdir(mode=0o700, exist_ok=False)
          PRIVATE = pathlib.Path(tempfile.mkdtemp(prefix='production-samples-native-private-', dir=TEMP))
          ENV = {'PATH': os.environ['PATH'], 'HOME': str(PRIVATE), 'DOCKER_CONFIG': str(PRIVATE / 'docker-config'),
                 'LC_ALL': 'C', 'TZ': 'UTC', 'SYSTEMD_COLORS': '0', 'SYSTEMD_LOG_COLOR': '0', 'SYSTEMD_PAGER': 'cat'}
          (PRIVATE / 'docker-config').mkdir(mode=0o700)
          SOURCES = ['.github/workflows/ci.yml', 'deploy/vm/agent-runner.service.template',
                     'deploy/vm/agent-router.service.template', 'deploy/production/runner.env.example',
                     'deploy/production/router.env.example', 'deploy/production/first-admin.conf.example',
                     'deploy/production/nginx.conf.template', 'deploy/production/prometheus.yml.example',
                     'deploy/production/alerts.yml.example', 'deploy/production/monitoring.md']
          IMAGES = {
              'nginx': {'image': 'docker.io/library/nginx:1.30.6@sha256:206f41196b946479a0fedeb1efd0598c31c45c248a6fa111430829efe94396f1',
                        'manifest': 'sha256:206f41196b946479a0fedeb1efd0598c31c45c248a6fa111430829efe94396f1',
                        'config': 'sha256:2cbc7a3757186de8dbcf1e19d4fc591e1e27789cdc526e51c933ae02f5f1f0b0'},
              'promtool': {'image': 'docker.io/prom/prometheus:v3.13.5@sha256:dc30314819e04a1a3d18d0b37eaa9c8e4e18f33f026e3e2d81bf127c7cddcd55',
                           'manifest': 'sha256:dc30314819e04a1a3d18d0b37eaa9c8e4e18f33f026e3e2d81bf127c7cddcd55',
                           'config': 'sha256:1ba6092485e679637f4d2fb8f2e0d83706bec6b139908a1f9910d9b424e80941'}}
          report = {'schema': 'production-samples-native-v1', 'runId': RUN, 'runAttempt': ATTEMPT,
                    'sourceCommit': COMMIT, 'scope': 'syntax-only-no-services-or-models',
                    'startedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'status': 'failed', 'commands': [], 'fixtures': [], 'images': IMAGES, 'containers': []}
          active = None
          stopped = None

          def require(ok, code):
              if not ok:
                  raise RuntimeError(code)

          def interrupted(sig, frame):
              global stopped
              stopped = signal.Signals(sig).name
              if active is not None and active.poll() is None:
                  try:
                      active.send_signal(sig)  # Only the newly created native helper, never a service daemon.
                  except ProcessLookupError:
                      pass

          signal.signal(signal.SIGINT, interrupted)
          signal.signal(signal.SIGTERM, interrupted)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def disk(enforce=True):
              rows = [{'path': str(path), 'freeBytes': shutil.disk_usage(path).free} for path in (ROOT, TEMP)]
              if enforce:
                  require(all(row['freeBytes'] >= 6 * 1024**3 for row in rows), 'less-than-6-GiB-free')
              return rows

          def source_rows():
              rows = []
              for name in sorted(SOURCES):
                  path = ROOT / name
                  require(path.is_file() and not path.is_symlink(), 'source-not-regular')
                  data = path.read_bytes()
                  rows.append({'path': name, 'bytes': len(data), 'mode': path.stat().st_mode & 0o777,
                               'sha256': sha(data)})
              return rows

          def write(path, data, mode=0o600, evidence=True):
              path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              payload = data.encode() if isinstance(data, str) else data
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, mode)
              with os.fdopen(fd, 'wb') as output:
                  output.write(payload)
              if evidence:
                  report['fixtures'].append({'path': str(path.relative_to(PRIVATE)), 'bytes': len(payload), 'sha256': sha(payload)})

          def native(label, argv, success=True, closure=False):
              global active
              if not closure:
                  require(stopped is None, 'cancelled-before-new-native-command')
              before_disk = disk(enforce=not closure)
              record = {'diskBefore': before_disk, 'label': label, 'argv': [str(value) for value in argv], 'nativeWaited': False, 'groupGone': False}
              report['commands'].append(record)
              prefix = str(len(report['commands'])).zfill(2) + '-' + label
              stdout = PROOF / (prefix + '.stdout.log')
              stderr = PROOF / (prefix + '.stderr.log')
              begun = time.monotonic()
              with stdout.open('xb') as out, stderr.open('xb') as err:
                  try:
                      active = subprocess.Popen(record['argv'], cwd=ROOT, env=ENV, stdin=subprocess.DEVNULL,
                                                stdout=out, stderr=err, start_new_session=True)
                      record['pid'] = active.pid
                      record['pgid'] = active.pid
                      record['nativeCode'] = active.wait()
                  finally:
                      if active is not None:
                          record['nativeCode'] = active.wait()
                          record['nativeWaited'] = True
                          while not record['groupGone']:
                              try:
                                  os.killpg(active.pid, 0)  # Existence only; keep original ownership until gone.
                              except ProcessLookupError:
                                  record['groupGone'] = True
                              except BaseException as error:
                                  record['groupProbeFailure'] = type(error).__name__
                              if not record['groupGone']:
                                  record['heldForGroupClosure'] = True
                                  time.sleep(0.1)
                          active = None
              record['elapsedSeconds'] = round(time.monotonic() - begun, 6)
              for name, path in (('stdout', stdout), ('stderr', stderr)):
                  require(path.stat().st_size <= 2 * 1024**2, 'native-output-over-2-MiB')
                  data = path.read_bytes()
                  record[name] = {'file': path.name, 'bytes': len(data), 'sha256': sha(data)}
              require(record['nativeWaited'] and record['groupGone'], 'native-helper-not-closed')
              record['diskAfter'] = disk(enforce=not closure)
              if not closure:
                  require(stopped is None, 'cancelled-after-native-wait')
              if success:
                  require(record['nativeCode'] == 0, 'native-nonzero-' + label)
              return stdout.read_bytes(), stderr.read_bytes(), record['nativeCode']

          def container(label, tool, entrypoint, arguments, mounts=(), extra=()):
              name = 'agent-service-syntax-' + RUN + '-' + ATTEMPT + '-' + label
              state = {'name': name, 'gone': False}
              report['containers'].append(state)
              cidfile = PRIVATE / (label + '.container-id')
              argv = [BIN['docker'], 'run', '--rm', '--pull=never', '--name', name, '--cidfile', str(cidfile), '--platform', 'linux/amd64',
                      '--network', 'none', '--read-only', '--cap-drop=ALL', '--security-opt=no-new-privileges',
                      '--user', str(os.getuid()) + ':' + str(os.getgid()), '--workdir', '/tmp',
                      '--tmpfs', '/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777', '--entrypoint', entrypoint]
              for source, destination in mounts:
                  argv += ['--mount', 'type=bind,src=' + str(source) + ',dst=' + destination + ',readonly']
              argv += list(extra) + [IMAGES[tool]['image']] + list(arguments)
              first = None
              try:
                  out, err, code = native(label, argv, success=False)
                  if code != 0:
                      first = RuntimeError('native-nonzero-' + label)
              except BaseException as error:
                  first = error
              finally:
                  try:
                      require(cidfile.is_file() and not cidfile.is_symlink(), 'container-id-file-unavailable')
                      cid = cidfile.read_text().strip()
                      require(re.fullmatch(r'[0-9a-f]{64}', cid) is not None, 'invalid-container-id')
                      state['id'] = cid
                  except BaseException as error:
                      state['idUnavailable'] = True
                      if first is None:
                          first = error
                  # Closure observation is always admitted, even after cancellation, low disk or logging errors.
                  # Only this exact newly requested name/CID is observed; never dispatch another tool payload.
                  while not state['gone']:
                      try:
                          selector = 'id=' + state['id'] if 'id' in state else 'name=^/' + name + '$'
                          remaining, _, observation_code = native(label + '-gone',
                              [BIN['docker'], 'ps', '-aq', '--no-trunc', '--filter', selector], success=False, closure=True)
                          state['gone'] = observation_code == 0 and remaining == b''
                          if not state['gone']:
                              state['closureObservationFailed'] = True
                      except BaseException as error:
                          state['closureObservationFailed'] = True
                          state['closureObservationFailureType'] = type(error).__name__
                      if not state['gone']:
                          time.sleep(0.1)  # Ownership barrier, no added deadline and no payload retry.
              if first is not None:
                  raise first
              require(not state.get('closureObservationFailed'), 'container-closure-observation-failed')
              require(code == 0, 'native-nonzero-' + label)
              return out, err

          try:
              require(os.uname().sysname == 'Linux' and os.uname().machine == 'x86_64', 'requires-Linux-amd64-host')
              report['hostPlatform'] = {'os': os.uname().sysname, 'release': os.uname().release, 'machine': os.uname().machine}
              report['sourceBefore'] = source_rows()
              report['templateInputRootSha256'] = sha(json.dumps(report['sourceBefore'], ensure_ascii=False, separators=(',', ':')).encode())
              BIN = {}
              report['hostTools'] = {}
              for name in ('git', 'docker', 'systemd-analyze', 'openssl'):
                  path = shutil.which(name, path=ENV['PATH'])
                  require(path is not None, 'required-tool-missing-' + name)
                  BIN[name] = str(pathlib.Path(path).resolve(strict=True))
                  report['hostTools'][name] = {'path': BIN[name], 'sha256': sha(pathlib.Path(BIN[name]).read_bytes())}
              head, _, _ = native('source-head-before', [BIN['git'], 'rev-parse', '--verify', 'HEAD'])
              require(head.strip().decode() == COMMIT, 'checkout-commit-mismatch')
              clean, _, _ = native('source-clean-before', [BIN['git'], 'status', '--porcelain=v1', '--untracked-files=no'])
              require(clean == b'', 'tracked-source-not-clean')
              version, _, _ = native('systemd-version', [BIN['systemd-analyze'], '--version'])
              match = re.search(rb'^systemd ([0-9]+)\b', version)
              require(match is not None and int(match.group(1)) >= 250, 'systemd-recursive-errors-requires-250')
              native('openssl-version', [BIN['openssl'], 'version'])
              native('docker-version', [BIN['docker'], 'version', '--format', '{{json .Client.Version}} {{json .Server.Version}}'])
              for tool, identity in IMAGES.items():
                  native(tool + '-pull', [BIN['docker'], 'pull', '--platform', 'linux/amd64', identity['image']])
                  output, _, _ = native(tool + '-inspect', [BIN['docker'], 'image', 'inspect', identity['image'],
                                        '--format', '{{json .Id}} {{json .Os}} {{json .Architecture}} {{json .RepoDigests}}'])
                  parsed = json.JSONDecoder()
                  fields = []
                  text = output.decode().strip()
                  while text:
                      value, end = parsed.raw_decode(text)
                      fields.append(value)
                      text = text[end:].lstrip()
                  require(len(fields) == 4 and fields[0] == identity['config'] and fields[1:3] == ['linux', 'amd64'], 'image-platform-or-config-mismatch')
                  require(isinstance(fields[3], list) and any(item.endswith('@' + identity['manifest']) for item in fields[3]), 'image-manifest-mismatch')
                  identity['observed'] = {'id': fields[0], 'os': fields[1], 'architecture': fields[2], 'repoDigests': fields[3]}

              stub = PRIVATE / 'stub-root'
              unitdir = stub / 'etc/systemd/system'
              for target in ('sysinit', 'basic', 'shutdown', 'network-online', 'multi-user', 'sockets', 'paths', 'timers', 'slices'):
                  write(unitdir / (target + '.target'), '[Unit]\nDescription=Syntax fixture dependency only\nDefaultDependencies=no\n')
              write(unitdir / 'system.slice', '[Unit]\nDescription=Syntax fixture slice only\nDefaultDependencies=no\n[Slice]\n')
              write(stub / 'etc/passwd', 'root:x:0:0:root:/root:/bin/false\nagent-runner:x:61001:61001:syntax:/nonexistent:/bin/false\nagent-router:x:61002:61002:syntax:/nonexistent:/bin/false\n')
              write(stub / 'etc/group', 'root:x:0:\nagent-runner:x:61001:\nagent-router:x:61002:\n')
              write(stub / 'usr/bin/node', '#!/bin/sh\n# Non-Node syntax stub; any accidental execution fails.\nexit 97\n', mode=0o700)
              for role in ('agent-runner', 'agent-router'):
                  write(unitdir / (role + '.service'), (ROOT / ('deploy/vm/' + role + '.service.template')).read_bytes())
                  write(stub / ('etc/agent-service/' + role + '.env'), 'NODE_ENV=production\n')
                  write(stub / ('opt/agent-service/' + role + '/current/dist/main.js'), '// Empty syntax fixture; never execute.\n')
                  (stub / ('var/lib/agent-service/' + role)).mkdir(mode=0o700, parents=True)
              (stub / 'var/lib/agent-service/agent-runner/blobs').mkdir(mode=0o700)
              dropin = unitdir / 'agent-runner.service.d/first-admin.conf'
              rendered = (ROOT / 'deploy/production/first-admin.conf.example').read_text().replace('__REPLACE_ACTUAL_INITIAL_TENANT__', 'ci-syntax-tenant')
              require('__' not in rendered, 'unrendered-first-admin-marker')
              write(dropin, rendered)
              verify = [BIN['systemd-analyze'], '--root=' + str(stub), '--man=no', '--recursive-errors=yes', 'verify', 'agent-runner.service', 'agent-router.service']
              _, errors, _ = native('systemd-first-admin', verify)
              require(errors == b'', 'systemd-first-admin-diagnostic')
              dropin.unlink()
              dropin.parent.rmdir()
              require(not dropin.exists(), 'first-admin-dropin-still-present')
              _, errors, _ = native('systemd-normal', verify)
              require(errors == b'', 'systemd-normal-diagnostic')
              report['systemd'] = {'firstAdminVerified': True, 'normalVerified': True, 'unitExecution': False,
                                   'root': 'isolated synthetic dependencies/accounts/empty role env and non-Node executable stub'}

              checks = PRIVATE / 'nginx'
              template = (ROOT / 'deploy/production/nginx.conf.template').read_text()
              replacements = {'__API_HOSTNAME__': 'api.invalid', '__TLS_FULLCHAIN_FILE__': '/checks/tls/fixture.crt',
                              '__TLS_PRIVATE_KEY_FILE__': '/checks/tls/fixture.key', '__TRUSTED_CALLER_EGRESS_CIDR__': '192.0.2.0/24'}
              for marker, value in replacements.items():
                  require(marker in template, 'missing-nginx-marker')
                  template = template.replace(marker, value)
              require('__' not in template, 'unrendered-nginx-marker')
              write(checks / 'server.conf', template)
              write(checks / 'nginx.conf', 'pid /tmp/nginx.pid;\nerror_log stderr crit;\nevents {}\nhttp { include /checks/server.conf; }\n')
              (checks / 'tls').mkdir(mode=0o700)
              native('synthetic-tls', [BIN['openssl'], 'req', '-x509', '-newkey', 'rsa:2048', '-sha256', '-nodes', '-days', '1',
                                      '-subj', '/CN=api.invalid', '-keyout', str(checks / 'tls/fixture.key'), '-out', str(checks / 'tls/fixture.crt')])
              os.chmod(checks / 'tls/fixture.key', 0o600)
              _, version = container('nginx-version', 'nginx', 'nginx', ['-v'])
              require(version.strip() == b'nginx version: nginx/1.30.6', 'unexpected-nginx-version')
              container('nginx-config', 'nginx', 'nginx', ['-t', '-c', '/checks/nginx.conf', '-p', '/tmp/'], [(checks, '/checks')],
                        ['--tmpfs', '/var/log/nginx:rw,noexec,nosuid,nodev,size=1m,mode=1777',
                         '--tmpfs', '/var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,mode=1777'])

              monitoring = PRIVATE / 'monitoring'
              write(monitoring / 'prometheus.yml', (ROOT / 'deploy/production/prometheus.yml.example').read_bytes())
              write(monitoring / 'alerts.yml', (ROOT / 'deploy/production/alerts.yml.example').read_bytes())
              # These parser-only values never leave the private fixture, including its evidence.
              write(monitoring / 'router.metrics.bearer', 'ci-parser-router-not-a-service-credential\n', evidence=False)
              write(monitoring / 'runner.metrics.bearer', 'ci-parser-runner-not-a-service-credential\n', evidence=False)
              mounts = [(monitoring, '/etc/agent-service/monitoring')]
              version, version_errors = container('promtool-version', 'promtool', '/bin/promtool', ['--version'])
              require(re.search(rb'^promtool, version 3\.13\.5(?:\s|$)', version + b'\n' + version_errors, re.MULTILINE) is not None, 'unexpected-promtool-version')
              container('promtool-config', 'promtool', '/bin/promtool', ['check', 'config', '/etc/agent-service/monitoring/prometheus.yml'], mounts)
              container('promtool-rules', 'promtool', '/bin/promtool', ['check', 'rules', '/etc/agent-service/monitoring/alerts.yml'], mounts)
              report['parsers'] = {'nginxConfig': True, 'prometheusConfig': True, 'prometheusRules': True,
                                   'network': 'none', 'rootFilesystem': 'read-only', 'startedApplicationOrDaemon': False}
              head, _, _ = native('source-head-after', [BIN['git'], 'rev-parse', '--verify', 'HEAD'])
              require(head.strip().decode() == COMMIT, 'checkout-commit-changed')
              clean, _, _ = native('source-clean-after', [BIN['git'], 'status', '--porcelain=v1', '--untracked-files=no'])
              require(clean == b'', 'tracked-source-changed')
              require(stopped is None, 'cancelled-before-completion')
              require(len(report['commands']) == 24 and all(row.get('nativeCode') == 0 for row in report['commands']), 'unexpected-native-count-or-code')
              require(all(space['freeBytes'] >= 6 * 1024**3 for row in report['commands'] for key in ('diskBefore', 'diskAfter') for space in row[key]), 'native-disk-minimum-not-met')
              require(len(report['containers']) == 5 and all(row.get('id') and row['gone'] for row in report['containers']), 'container-identity-or-closure-incomplete')
              report['status'] = 'passed'
          except BaseException as error:
              report['failureCode'] = str(error) if isinstance(error, RuntimeError) else type(error).__name__
          finally:
              try:
                  report['sourceAfter'] = source_rows()
                  if report.get('sourceBefore') != report['sourceAfter']:
                      report['status'] = 'failed'
                      report.setdefault('failureCode', 'source-template-changed')
              except BaseException:
                  report['status'] = 'failed'
                  report.setdefault('failureCode', 'source-after-unavailable')
              report['cancelSignal'] = stopped
              report['nativeAllClosed'] = all(row['nativeWaited'] and row['groupGone'] for row in report['commands']) and all(row['gone'] for row in report['containers'])
              if not report['nativeAllClosed'] or stopped is not None:
                  report['status'] = 'failed'
                  report.setdefault('failureCode', 'native-closure-or-cancellation')
              report['finishedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              payload = (json.dumps(report, sort_keys=True, indent=2) + '\n').encode()
              with (PROOF / 'report.json').open('xb') as output:
                  output.write(payload)
              rows = [{'file': file.name, 'bytes': file.stat().st_size, 'sha256': sha(file.read_bytes())} for file in sorted(PROOF.iterdir())]
              manifest = (json.dumps({'schema': 'production-samples-native-artifact-v1', 'sourceCommit': COMMIT,
                                     'runId': RUN, 'runAttempt': ATTEMPT, 'files': rows}, sort_keys=True, indent=2) + '\n').encode()
              with (PROOF / 'artifact-manifest.json').open('xb') as output:
                  output.write(manifest)
              print('PRODUCTION_SAMPLES_NATIVE status=' + report['status'] + ' source=' + COMMIT + ' reportSha256=' + sha(payload) + ' artifactManifestSha256=' + sha(manifest), flush=True)
          raise SystemExit(0 if report['status'] == 'passed' else 1)
          PY_NATIVE_SAMPLES

