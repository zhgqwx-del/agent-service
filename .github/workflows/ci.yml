name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic test constant, never a real key: the fake vendor stands in for the model provider.
  SECRETS_MASTER_KEY: "1111111111111111111111111111111111111111111111111111111111111111"

jobs:
  # Three independent runners collect one disjoint native-Vitest shard each. Only the
  # official aggregate below may claim repository-wide coverage or required-group proof.
  test-main:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.0.26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - name: Create isolated main test database
        run: mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE agent_service_test_main CHARACTER SET utf8mb4;"
      - name: Attest this job's disposable MySQL service before authority tests
        env:
          MYSQL_TEST_SERVICE_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test_main
        run: node scripts/ci-owned-mysql-authority.mjs
      - name: Collect native main coverage shard (global coverage gate pending)
        env:
          AGENT_SERVICE_INTEGRATION: "1"
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test_main
          REDIS_TEST_URL: redis://127.0.0.1:6379/1
        run: |
          node scripts/run-main-coverage-shard.mjs --shard ${{ matrix.shard }} --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-commit "$GITHUB_SHA" --artifact-dir "$RUNNER_TEMP/main-coverage-shard-${{ matrix.shard }}"
      - name: Preserve original main shard evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-coverage-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-shard-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-main-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ always() }}
    needs: [test-main]
    steps:
      - name: Require every main shard to succeed
        env:
          MAIN_SHARDS_RESULT: ${{ needs.test-main.result }}
        run: test "$MAIN_SHARDS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download original main shard 1
        uses: actions/download-artifact@v4
        with:
          name: main-coverage-shard-1-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-inputs/main-coverage-shard-1
      - name: Download original main shard 2
        uses: actions/download-artifact@v4
        with:
          name: main-coverage-shard-2-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-inputs/main-coverage-shard-2
      - name: Download original main shard 3
        uses: actions/download-artifact@v4
        with:
          name: main-coverage-shard-3-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-inputs/main-coverage-shard-3
      - name: Official native report and V8 coverage merge with original global and implementation gates
        run: |
          node scripts/merge-main-coverage.mjs --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-commit "$GITHUB_SHA" --artifacts-dir "$RUNNER_TEMP/main-coverage-inputs" --output-dir "$RUNNER_TEMP/main-coverage-aggregate"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-coverage-aggregate/coverage/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve merged main execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-coverage-proof-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/main-coverage-aggregate/tests.json
            ${{ runner.temp }}/main-coverage-aggregate/proof.json
            ${{ runner.temp }}/main-coverage-aggregate/discovery.json
          if-no-files-found: error
          retention-days: 7

  test-runtime:
    runs-on: ubuntu-latest
    # All original process/S3/build/VM gates keep serial resource ownership on this runner.
    # Main and historical shards own separate service instances; no schema or Redis is shared.
    timeout-minutes: 180
    env:
      MINIO_SOURCE_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    services:
      mysql:
        # Pin the supported floor here; the image job below deliberately keeps the moving 8.0 tag
        # so CI proves both oldest-supported migration SQL and current 8.0 image compatibility.
        image: mysql:8.0.26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          # Frozen 0038, 0039 and 0040 binary fixtures archive exact published commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.8
          cache: false
      - name: Build and start real MinIO from the pinned official commit
        env:
          # Deterministic CI-only values scoped to the MinIO process launched by this step.
          MINIO_ROOT_USER: agentservice-ci
          MINIO_ROOT_PASSWORD: agent-service-ci-minio-only-0001
        run: |
          mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
          GOTOOLCHAIN=local GOBIN="$RUNNER_TEMP/minio-bin" \
            go install "github.com/minio/minio@$MINIO_SOURCE_COMMIT"
          nohup "$RUNNER_TEMP/minio-bin/minio" --quiet --anonymous server \
            "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 >"$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/minio.pid"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$i" = "90" ]; then echo "MinIO did not become ready"; exit 1; fi
            sleep 1
          done
      - name: Bootstrap distinct logical private un-versioned MinIO buckets
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: |
          node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-restore-journal \
            node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-backup-catalog \
            node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-tenant-telemetry \
            node packages/store/scripts/bootstrap-s3.mjs
          S3_TEST_BUCKET=agent-service-ci-telemetry-disposition \
            node packages/store/scripts/bootstrap-s3.mjs

      - name: Verify OpenAPI and generated SDK are current
        run: pnpm run check:api

      - name: Typecheck (sources and tests)
        run: pnpm typecheck

      - name: Create test databases
        run: |
          mysql -h 127.0.0.1 -uroot -e "
            CREATE DATABASE IF NOT EXISTS agent_service_test CHARACTER SET utf8mb4;
            CREATE DATABASE IF NOT EXISTS agent_service_cluster CHARACTER SET utf8mb4;"

      # Keep the existing process gates ahead of the long coverage/S3 matrix so a cluster
      # regression fails early. Their separate MySQL schema/Redis DB and all assertions stay intact.
      - name: Cluster tests (real processes)
        env:
          AGENT_SERVICE_CLUSTER: "1"
          CLUSTER_MYSQL_URL: mysql://root@127.0.0.1:3306/agent_service_cluster
          CLUSTER_REDIS_URL: redis://127.0.0.1:6379/3
        run: pnpm vitest run test/cluster

      # Parse an exact JSON report in addition to the broad cluster run. This proves the T3g
      # mixed-worker, mixed-namespace and active-fleet rollout matrix ran with zero skipped cases.
      - name: Tenant Redis purge cluster rollout suite (must execute)
        env:
          CLUSTER_MYSQL_URL: mysql://root@127.0.0.1:3306/agent_service_cluster
          CLUSTER_REDIS_URL: redis://127.0.0.1:6379/3
        run: pnpm run test:tenant-redis-purge-cluster

      # These profiles need dedicated flags/services and cannot be replaced by the main report.
      - name: Blob S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:blob-s3

      - name: Managed skills shared MySQL and MinIO vertical (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:skills-s3

      # Use a distinct bucket to prove namespace and credential wiring isolation from BlobStore.
      # One local MinIO process is only a protocol/fault simulation, not proof of a physically
      # independent production failure domain. The suite exercises concurrent immutable appends,
      # exact response-loss inspection and sealed-prefix replay.
      - name: Restore journal S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_RESTORE_JOURNAL_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:restore-journal-s3

      # Use a third bucket so the catalog protocol cannot accidentally share the Blob data plane
      # or restore-journal namespace. Local MinIO proves protocol/fault handling only; it is not an
      # independent production failure domain.
      - name: Backup catalog S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_BACKUP_CATALOG_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:backup-catalog-s3

      # Use a fourth bucket so managed telemetry artifacts cannot share the Blob, restore-journal,
      # or backup-catalog namespace. This proves the S3 protocol against real MinIO only; it does
      # not prove a physically independent production failure domain, IAM policy, or managed sink.
      - name: Tenant telemetry writer S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_TENANT_TELEMETRY_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:tenant-telemetry-writer-s3

      # The fixture drives original provider HTTP/stream failure through PiEngine/SessionHost,
      # real MySQL failed-step commit and the existing worker into actual MinIO bytes/ACK.
      # It proves local capture only: sixth-source erasure/grant remain hard denied.
      - name: Persisted provider failure capture real MySQL and MinIO E2E (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_FORCE_PATH_STYLE: "1"
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
        run: pnpm run test:telemetry-capture-mysql-s3

      # The fifth logical bucket exercises v1 fixture CAS, the v2 journal observer, and
      # the 0046 artifact observer under separate random prefixes and required no-skip files.
      # Same-host MinIO does not prove a production fault domain or a DB grant.
      - name: Tenant telemetry disposition S3 and v2 read-only observer real MinIO suites (must execute)
        env:
          AGENT_SERVICE_TELEMETRY_DISPOSITION_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TELEMETRY_DISPOSITION_TEST_BUCKET: agent-service-ci-telemetry-disposition
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:tenant-telemetry-disposition-s3

      # Non-production protocol substrate only: no DB grant, product delete or physical ACK.
      - name: Tenant telemetry disposition v3 journal real MinIO suite (must execute)
        env:
          AGENT_SERVICE_TELEMETRY_DISPOSITION_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TELEMETRY_DISPOSITION_TEST_BUCKET: agent-service-ci-telemetry-disposition
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: |
          pnpm run test:tenant-telemetry-disposition-journal-v3-s3
          pnpm run test:tenant-telemetry-disposition-journal-v3-observer-s3

      # Read real writer bytes in the fourth bucket, and fixture markers in the fifth;
      # both use separate random prefixes and the observer itself issues GET only.
      - name: Tenant telemetry artifact GET-only observer real MinIO suite (must execute)
        env:
          AGENT_SERVICE_TELEMETRY_DISPOSITION_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TELEMETRY_DISPOSITION_TEST_BUCKET: agent-service-ci-telemetry-disposition
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:tenant-telemetry-artifact-observer-s3

      # Exercise the actual one-shot CLI across both durability systems. The fixture creates a
      # random disposable database and S3 prefix, proves paged/exact replay and complete external
      # chain mirroring, and verifies that only the selected backup without an exact local anchor
      # remains ineligible for restore while later content-free events continue to project.
      - name: Backup catalog reconcile real MySQL + MinIO suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:backup-catalog-reconcile-mysql-s3

      # Restore an actual mysqldump image that predates two external availability events and one
      # reservation. The required fixture proves the same 0031 operation reconstructs its local
      # authority before ordinary 0030 replay may seal and activate the restored runtime.
      - name: Verify trusted host MySQL 8 artifact tools
        run: |
          mysql_binary="$(command -v mysql)"
          mysqldump_binary="$(command -v mysqldump)"
          [[ "$mysql_binary" = /* && -x "$mysql_binary" ]]
          [[ "$mysqldump_binary" = /* && -x "$mysqldump_binary" ]]
          "$mysql_binary" --no-defaults --version | grep -Eq 'Ver 8[.]|Distrib 8[.]'
          "$mysqldump_binary" --no-defaults --version | grep -Eq 'Ver 8[.]|Distrib 8[.]'
          echo "BACKUP_MYSQL_BINARY=$mysql_binary" >> "$GITHUB_ENV"
          echo "BACKUP_MYSQLDUMP_BINARY=$mysqldump_binary" >> "$GITHUB_ENV"
          echo "Trusted host MySQL 8 tools verified; runner image does not include these tools"

      - name: Backup catalog old-snapshot restore roundtrip (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:backup-catalog-restore-roundtrip-mysql-s3

      # This invokes the actual producer and encrypted-byte verifier, then imports only to
      # disposable empty databases. Its independent required-suite report rejects skips/zero tests.
      - name: MySQL encrypted backup artifact real MySQL + MinIO suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:mysql-backup-artifact-mysql-s3

      - name: Capture new-epoch encrypted restore with real HTTP fleet + MySQL + MinIO (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_BACKUP_CATALOG_TEST_BUCKET: agent-service-ci-backup-catalog
          S3_RESTORE_JOURNAL_TEST_BUCKET: agent-service-ci-restore-journal
          S3_TENANT_TELEMETRY_TEST_BUCKET: agent-service-ci-tenant-telemetry
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:telemetry-capture-restore-mysql-s3

      # The offline mover crosses both InnoDB and object-storage durability boundaries. Keep a
      # named proof with a fresh database and namespace per case; the wrapper rejects skips/zero tests.
      - name: Blob migration real MySQL + MinIO suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:blob-storage-migration-mysql-s3

      - name: Build distributable artifacts and boot plain Node bundles
        run: pnpm run build:check

      - name: Build independent VM role packages and boot with plain Node (no external services)
        run: pnpm run check:vm-release --artifacts "$RUNNER_TEMP/agent-service-vm-releases"

      # The trusted job log publishes all three raw digests; a sidecar alone is not authority.
      # These are target-bound candidates, not signed production deployments or cloud resources.
      - name: Preserve verified Node 24 VM transport candidates
        uses: actions/upload-artifact@v4
        with:
          name: vm-process-releases-linux-x64-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-service-vm-releases/
          if-no-files-found: error
          retention-days: 14

      # Keep a separate, named proof that the runner's one-shot mover artifact exists and executes
      # under plain Node. build:check also runs this gate so local verification cannot omit it.
      - name: Runner Blob migration distributable CLI (must execute)
        run: pnpm run check:blob-storage-migrate-artifact

      - name: Runner restore-ledger reconciliation distributable CLI (must execute)
        run: pnpm run check:restore-ledger-reconcile-artifact

      - name: Runner telemetry capture distributable CLI (must execute)
        run: pnpm run check:telemetry-capture-artifact

      - name: Runner authoritative backup catalog distributable CLI (must execute)
        run: pnpm run check:backup-catalog-artifact

      # Start the production-shaped bundles against a throwaway MySQL schema and the real MinIO
      # process above. This proves the bundled AWS SDK closure, migration 0027 storage control,
      # migration 0028 mover ledger and exact fleet namespace negotiation at the application wiring
      # boundary; object-store credentials are scoped to this step and passed only to the runner.
      - name: S3 bundled runner/router application assembly smoke (must execute)
        env:
          AGENT_SERVICE_APP_SMOKE_MODE: dist
          MYSQL_APP_SMOKE_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:app-s3-smoke

  # Historical files retain their original ordered manifest and individual case budgets.
  # Each native shard owns a separate MySQL runner; aggregate validates their exact raw union.
  test-history-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.0.26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - name: Create isolated historical test database
        run: mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE agent_service_test_history CHARACTER SET utf8mb4;"
      - name: Historical MySQL migration shard (all assigned files, no skips)
        env:
          MYSQL_MIGRATION_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test_history
        run: node scripts/run-migration-shard.mjs --shard ${{ matrix.shard }}/3
      - name: Preserve original historical shard evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .local-run/migration-shards/${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ always() }}
    needs: [test-history-shard]
    steps:
      - name: Require every historical shard to succeed
        env:
          HISTORY_SHARDS_RESULT: ${{ needs.test-history-shard.result }}
        run: test "$HISTORY_SHARDS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download original historical shard 1
        uses: actions/download-artifact@v4
        with:
          name: migration-shard-1-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.local-run/migration-shards/1
      - name: Download original historical shard 2
        uses: actions/download-artifact@v4
        with:
          name: migration-shard-2-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.local-run/migration-shards/2
      - name: Download original historical shard 3
        uses: actions/download-artifact@v4
        with:
          name: migration-shard-3-attempt-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.local-run/migration-shards/3
      - name: Verify exact current historical manifest and zero-skip union
        run: node scripts/merge-migration-shards.mjs --input-dir "$GITHUB_WORKSPACE/.local-run/migration-shards"
      - name: Preserve historical execution proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-migration-proof-attempt-${{ github.run_attempt }}
          path: |
            .local-run/migration-shards/1/tests.json
            .local-run/migration-shards/1/metadata.json
            .local-run/migration-shards/2/tests.json
            .local-run/migration-shards/2/metadata.json
            .local-run/migration-shards/3/tests.json
            .local-run/migration-shards/3/metadata.json
            .local-run/migration-aggregate-${{ github.run_id }}-${{ github.run_attempt }}/aggregate-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Preserve the stable core check only when both the exact native coverage aggregate and
  # every original runtime/S3/distribution gate actually succeeded. Skips/cancels are failures.
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [test-main-merge, test-runtime]
    steps:
      - name: Require main coverage and every runtime gate to succeed
        env:
          MAIN_MERGE_RESULT: ${{ needs.test-main-merge.result }}
          RUNTIME_RESULT: ${{ needs.test-runtime.result }}
        run: |
          set -euo pipefail
          test "$MAIN_MERGE_RESULT" = success
          test "$RUNTIME_RESULT" = success

  # The production image is part of the contract, so it is built and started here. Every one of the
  # Dockerfile defects found in review was invisible precisely because CI never did this.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [agent-runner, agent-router]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service_test_image_base
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP=${{ matrix.app }}
          tags: agent-service/${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute the one-shot Blob migration CLI from the runner image
        if: matrix.app == 'agent-runner'
        run: |
          docker run --rm --entrypoint node agent-service/agent-runner:ci \
            dist/blob-storage-migrate.js --help | grep -F "Usage: blob-storage-migrate"

      - name: Execute the one-shot restore-ledger CLI from the runner image
        if: matrix.app == 'agent-runner'
        run: |
          docker run --rm --entrypoint node agent-service/agent-runner:ci \
            dist/restore-ledger-reconcile.js --help | grep -F "Usage: restore-ledger-reconcile"

      - name: Execute the one-shot backup-catalog CLI from the runner image
        if: matrix.app == 'agent-runner'
        run: |
          docker run --rm --entrypoint node agent-service/agent-runner:ci \
            dist/backup-catalog.js --help | grep -F "Usage: backup-catalog"

      - name: Execute the local-only telemetry capture CLI from the runner image
        if: matrix.app == 'agent-runner'
        run: |
          docker run --rm --entrypoint node agent-service/agent-runner:ci \
            dist/telemetry-capture.js --help | grep -F "Usage: telemetry-capture"

      - name: Runner image operator entrypoints reject ambient application key authority
        if: matrix.app == 'agent-runner'
        run: |
          set -euo pipefail
          for entry in backup-catalog restore-ledger-reconcile; do
            if output="$(docker run --rm -e TENANT_TELEMETRY_REF_KEY= --entrypoint node \
              agent-service/agent-runner:ci "dist/${entry}.js" status 2>&1)"; then
              echo "operator unexpectedly accepted ambient key authority" >&2
              exit 1
            fi
            test "$output" = '{"status":"error","code":"invalid_configuration"}'
          done

      # This disposable job service owns the test database and grants. The read-only test
      # fixtures are mounted only into this preparation container, never shipped in an image.
      # Use the same immutable local image ID for preparation and the subsequent runtime.
      - name: Prepare explicit schema and runtime authority with the selected runner image
        if: matrix.app == 'agent-runner'
        env:
          CI_IMAGE_MYSQL_SERVICE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          [[ "$CI_IMAGE_MYSQL_SERVICE_CONTAINER_ID" =~ ^[a-f0-9]{64}$ ]]
          MYSQL_SERVER_UUID="$(docker exec "$CI_IMAGE_MYSQL_SERVICE_CONTAINER_ID" mysql -uroot --batch --skip-column-names -e 'SELECT @@server_uuid')"
          [[ "$MYSQL_SERVER_UUID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]]
          RUNNER_IMAGE_ID="$(docker image inspect --format '{{.Id}}' agent-service/agent-runner:ci)"
          [[ "$RUNNER_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          umask 077
          FIXTURE_DIRECTORY="$(mktemp -d "$RUNNER_TEMP/agent-service-image-runtime-XXXXXX")"
          chmod 700 "$FIXTURE_DIRECTORY"
          # Publish only the owned path before preparation, so a partial-file failure is cleaned too.
          printf 'CI_IMAGE_RUNTIME_ENV_FILE=%s\n' "$FIXTURE_DIRECTORY/runtime.env" >> "$GITHUB_ENV"
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/test/fixtures,target=/app/ci,readonly" \
            --mount "type=bind,source=$FIXTURE_DIRECTORY,target=/fixture" \
            -e GITHUB_ACTIONS=true \
            -e CI_IMAGE_MYSQL_URL=mysql://root@127.0.0.1:3306/agent_service_test_image_base \
            -e CI_IMAGE_MYSQL_SERVER_UUID="$MYSQL_SERVER_UUID" \
            -e CI_IMAGE_RUNTIME_DIRECTORY=/fixture \
            --entrypoint node "$RUNNER_IMAGE_ID" /app/ci/ci-image-runtime.mjs
          for name in runtime.env ready.json database.txt; do
            test -f "$FIXTURE_DIRECTORY/$name" && test ! -L "$FIXTURE_DIRECTORY/$name"
            test "$(stat -c '%a' "$FIXTURE_DIRECTORY/$name")" = 600
          done
          CI_IMAGE_DATABASE="$(<"$FIXTURE_DIRECTORY/database.txt")"
          [[ "$CI_IMAGE_DATABASE" =~ ^agent_service_test_image_[a-f0-9]{16}$ ]]
          # Only nonsecret paths/identities enter GITHUB_ENV. Never cat runtime.env or log a DSN.
          printf 'CI_IMAGE_DATABASE=%s\nCI_RUNNER_IMAGE_ID=%s\n' \
            "$CI_IMAGE_DATABASE" "$RUNNER_IMAGE_ID" >> "$GITHUB_ENV"

      # A container that starts but is unreachable, or reports healthy on the wrong port, is the exact
      # failure mode this step exists to catch.
      - name: Run the container and reach it from outside
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "agent-runner" ]; then
            docker run -d --name app --network host \
              --env-file "$CI_IMAGE_RUNTIME_ENV_FILE" \
              -e SECRETS_MASTER_KEY=$SECRETS_MASTER_KEY \
              -e INTERNAL_ROUTER_TOKEN=ci-internal-router-token-00000001 \
              -e STORE=mysql \
              -e REDIS_URL=redis://127.0.0.1:6379 \
              -e ADMIN_BOOTSTRAP_TENANT=t_ci \
              -e ADMIN_BOOTSTRAP_OUTPUT_FILE=/app/.data/admin-bootstrap-key \
              -e RUNNER_ADDR=127.0.0.1:8787 -e RUNNER_PORT=8787 \
              "$CI_RUNNER_IMAGE_ID"
            test "$(docker inspect -f '{{.Image}}' app)" = "$CI_RUNNER_IMAGE_ID"
            PORT=8787
          else
            docker run -d --name app --network host \
              -e INTERNAL_ROUTER_TOKEN=ci-internal-router-token-00000001 \
              -e RUNNERS=http://127.0.0.1:8787 -e ROUTER_PORT=8080 \
              agent-service/${{ matrix.app }}:ci
            PORT=8080
          fi
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then echo "reachable on $PORT"; break; fi
            if [ "$i" = "60" ]; then echo "never became reachable; raw logs withheld to protect credentials"; exit 1; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/openapi.json" | grep -q '"openapi":"3.1.0"'
          # Docker's own healthcheck must agree, which is what catches a wrong port in HEALTHCHECK.
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            if [ "$i" = "40" ]; then echo "healthcheck says $status; raw logs withheld to protect credentials"; exit 1; fi
            sleep 2
          done
          # Explicit schema preparation must use this same image; ordinary runtime never applies DDL.
          if [ "${{ matrix.app }}" = "agent-runner" ]; then
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0027_blob_storage_control.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0028_blob_storage_migration.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0029_tenant_credential_target_execution.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0030_tenant_restore_journal.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0031_authoritative_backup_catalog.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0032_tenant_telemetry_lifecycle.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0033_tenant_telemetry_activation_inventory.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0034_tenant_telemetry_durable_writer.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0035_tenant_telemetry_application_capture.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0036_tenant_telemetry_disposition.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0037_tenant_telemetry_disposition_grant_guard.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0038_tenant_telemetry_artifact_membership.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0039_tenant_telemetry_owner_closure.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0040_tenant_telemetry_source_accounting.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0041_tenant_telemetry_target_manifest.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0042_tenant_telemetry_plan_artifact_target.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0044_tenant_telemetry_pregrant_intent.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0049_tenant_telemetry_application_capture_v2.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0050_ordinary_session_delete_grace.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0051_ordinary_session_delete_origin_guard.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0052_ordinary_session_usage_retention.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -e "select name from schema_migrations" | grep -q 0053_persisted_provider_failure_capture.sql
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0054_tenant_telemetry_retained_source.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0055_tenant_telemetry_capture_backup_checkpoint.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0056_tenant_telemetry_capture_restore_history.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0057_tenant_telemetry_capture_epoch_cutover.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0058_tenant_telemetry_capture_repeat_restore.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0059_credential_responsibility.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0060_skill_registry.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0061_skill_registry_native_lookup.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0062_mcp_registry.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0063_tenant_webhooks.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0064_subagents.sql'" | grep -Fxq 1
            mysql -h 127.0.0.1 -uroot "$CI_IMAGE_DATABASE" -Nse "SELECT COUNT(*) FROM schema_migrations WHERE name = '0065_mcp_dcr.sql'" | grep -Fxq 1
            # Exercise the production-safe one-time bootstrap path. Do not weaken the production
            # guard by injecting BOOTSTRAP_API_KEY. The secret is read from the create-only 0600
            # file inside the container and must never be present in docker logs.
            [ "$(docker exec app stat -c '%a' /app/.data/admin-bootstrap-key)" = "600" ]
            CI_KEY=$(docker exec app cat /app/.data/admin-bootstrap-key)
            if ! printf '%s' "$CI_KEY" | grep -Eq '^ask_[A-Za-z0-9_-]+$'; then
              echo "production admin bootstrap file did not contain a valid key"
              exit 1
            fi
            if docker logs app 2>&1 | grep -Eq 'ask_[A-Za-z0-9_-]+|t_ci'; then
              echo "production bootstrap secret or tenant leaked to docker logs"
              exit 1
            fi
            curl -fsS -X POST http://127.0.0.1:8787/v1/agents \
              -H "Authorization: Bearer $CI_KEY" -H 'X-User-Id: u1' -H 'content-type: application/json' \
              -d '{"name":"ci","instructions":"x","model":{"provider":"dashscope","model":"qwen-plus"}}' >/dev/null
          fi
          docker rm -f app

      - name: Remove only this job's private runtime credential file
        if: ${{ always() && matrix.app == 'agent-runner' }}
        run: |
          set -euo pipefail
          if [ -n "${CI_IMAGE_RUNTIME_ENV_FILE-}" ]; then
            case "$CI_IMAGE_RUNTIME_ENV_FILE" in
              "$RUNNER_TEMP"/agent-service-image-runtime-??????/runtime.env)
                rm -f -- "$CI_IMAGE_RUNTIME_ENV_FILE"
                ;;
              *) echo "private runtime credential path is not owned by this job" >&2; exit 1 ;;
            esac
          fi

  # Preserve the original required check identity. Neither skipped/cancelled dependencies nor
  # a failed image matrix may yield a green aggregate. All three direct dependencies are needed:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [test-core, test-history, image]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Require every test and image job to succeed
        env:
          AGENT_SERVICE_CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/assert-ci-required-jobs.mjs
