name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic test constant, never a real key: the fake vendor stands in for the model provider.
  SECRETS_MASTER_KEY: "1111111111111111111111111111111111111111111111111111111111111111"

jobs:
  test:
    runs-on: ubuntu-latest
    # Building the pinned official MinIO source adds a few minutes to the existing full matrix.
    timeout-minutes: 45
    env:
      MINIO_SOURCE_COMMIT: 07c3a429bfed433e49018cb0f78a52145d4bedeb
    services:
      mysql:
        # Pin the supported floor here; the image job below deliberately keeps the moving 8.0 tag
        # so CI proves both oldest-supported migration SQL and current 8.0 image compatibility.
        image: mysql:8.0.26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject committed credentials
        run: node scripts/check-secrets.mjs
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.8
          cache: false
      - name: Build and start real MinIO from the pinned official commit
        env:
          # Deterministic CI-only values scoped to the MinIO process launched by this step.
          MINIO_ROOT_USER: agentservice-ci
          MINIO_ROOT_PASSWORD: agent-service-ci-minio-only-0001
        run: |
          mkdir -p "$RUNNER_TEMP/minio-bin" "$RUNNER_TEMP/minio-data"
          GOTOOLCHAIN=local GOBIN="$RUNNER_TEMP/minio-bin" \
            go install "github.com/minio/minio@$MINIO_SOURCE_COMMIT"
          nohup "$RUNNER_TEMP/minio-bin/minio" --quiet --anonymous server \
            "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 >"$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/minio.pid"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$i" = "90" ]; then echo "MinIO did not become ready"; exit 1; fi
            sleep 1
          done
      - name: Bootstrap private un-versioned MinIO bucket
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: node packages/store/scripts/bootstrap-s3.mjs

      - name: Verify OpenAPI and generated SDK are current
        run: pnpm run check:api

      - name: Typecheck (sources and tests)
        run: pnpm typecheck

      - name: Create test databases
        run: |
          mysql -h 127.0.0.1 -uroot -e "
            CREATE DATABASE IF NOT EXISTS agent_service_test CHARACTER SET utf8mb4;
            CREATE DATABASE IF NOT EXISTS agent_service_cluster CHARACTER SET utf8mb4;"

      # Unit + store conformance (both backends) + HTTP + dialect tests against the fake vendor.
      # Coverage thresholds live in vitest.config.ts and fail the job on a regression.
      - name: Unit and integration tests
        env:
          AGENT_SERVICE_INTEGRATION: "1"
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          REDIS_TEST_URL: redis://127.0.0.1:6379/1
        run: |
          mkdir -p .local-run
          pnpm vitest run --coverage --exclude 'test/cluster/**' \
            --reporter=default --reporter=json --outputFile.json=.local-run/verify-tests.json

      # The integration suite skips itself when the env var is missing, which would make a
      # misconfigured job pass with half the tests silently absent.
      - name: Assert the integration suite actually ran
        run: node scripts/assert-suites-ran.mjs

      # Keep a named, verbose, no-skip proof for the real-MySQL ownership/cleanup contract. The
      # broad coverage suite alone does not make execution of this dedicated concurrency file clear.
      - name: Blob lifecycle real MySQL suite (must execute)
        env:
          AGENT_SERVICE_INTEGRATION: "1"
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:blob-mysql

      # The write-once storage control is a rolling-upgrade boundary. Keep both the in-memory
      # atomic contract and real-InnoDB rollback/concurrency suite visible and impossible to skip.
      - name: Blob storage control memory suite (must execute)
        run: pnpm run test:blob-storage-control-memory

      - name: Blob storage control real MySQL suite (must execute)
        env:
          AGENT_SERVICE_INTEGRATION: "1"
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:blob-storage-control-mysql

      # Exercise the actual S3 protocol against a fixed MinIO source revision. The required-suite
      # wrapper rejects a missing file, a silently skipped suite, zero assertions, or any non-passing case.
      - name: Blob S3 real MinIO suite (must execute)
        env:
          AGENT_SERVICE_S3_INTEGRATION: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:blob-s3

      # Keep a named, verbose, no-skip proof for the lifecycle queue. The broad coverage assertion
      # above cannot by itself prove that this dedicated real-MySQL concurrency file executed.
      - name: Lifecycle outbox real MySQL suite (must execute)
        env:
          AGENT_SERVICE_INTEGRATION: "1"
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:outbox-mysql

      # Usage reconciliation is a financial/content separation boundary. Keep explicit no-skip
      # evidence for transactional dual-write, conflict rollback, legal hold and anonymization.
      - name: Usage lifecycle real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:usage-lifecycle-mysql

      # The subject gate is the linearization point for erasure versus new runtime writes. This
      # named runner parses the JSON report and fails if the dedicated real-MySQL suite did not run.
      - name: Subject lifecycle real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:subject-lifecycle-mysql

      # Tenant erasure admission is the all-credential logical revocation point. Keep explicit
      # InnoDB proof for rollback, request/write races, dormant rolling-upgrade authority and
      # cross-tenant isolation rather than relying on a fresh-schema coverage run.
      - name: Tenant credential revocation real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-credential-revocation-mysql

      # T3a is the first destructive tenant lifecycle transaction. Keep an independent no-skip
      # proof for DB-clock leases, raw-owner isolation, rollback and immutable receipt replay.
      - name: Tenant credential physical revocation real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-credential-physical-revocation-mysql

      # Credential source tracking is a rolling-upgrade and destructive-lifecycle boundary. Keep
      # explicit InnoDB proof for active-cutover CAS, ABA prevention, sidecar rollback/integrity,
      # Unicode owner isolation and wrong-slot corruption rejection.
      - name: Tenant credential lifecycle real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-credential-lifecycle-mysql

      # T3b commits a complete configured-fleet proof beside the terminal queue transition. Keep
      # explicit InnoDB evidence for live-source admission, exact replay and transaction rollback.
      - name: Tenant runtime revocation real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-runtime-revocation-mysql

      # T3c turns a terminal T3b proof into a DB-clock, owner-complete structural inventory without
      # deleting content. Prove pagination, exact replay, hold/deadline gates and SQL rollback on
      # real InnoDB, and keep the suite visible so it cannot silently disappear from broad coverage.
      - name: Tenant content inventory real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-content-inventory-mysql

      # T3d seals a fixed all-domain plan while keeping execution impossible. Prove DB-clock
      # claims, source/hold revalidation, blocker evidence and post-write lease rollback on InnoDB.
      - name: Tenant purge plan real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-purge-plan-mysql

      # T3e crosses the first destructive tenant-wide boundary. Keep explicit real-InnoDB proof
      # for hold/lease linearization, all-or-nothing usage/blob/export cutover, exact outbox ACKs,
      # response-loss replay, dead letters, concurrency and tenant isolation.
      - name: Tenant purge execution real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-purge-execution-mysql

      # T3f deletes database-resident content only after consuming the immutable T3e receipt.
      # Keep explicit no-skip proof for the in-memory atomic boundary and response-loss replay.
      - name: Tenant database purge memory suite (must execute)
        run: pnpm run test:tenant-database-purge-memory

      # Repeat the same destructive boundary against real InnoDB so locks, rollback, leases,
      # owner isolation and lifecycle-outbox settlement cannot pass on memory semantics alone.
      - name: Tenant database purge real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:tenant-database-purge-mysql

      # T3g spans an immutable MySQL evidence chain and a separately atomic Redis mutation. Keep
      # explicit no-skip proofs for the pure contract, real InnoDB transactions and real Redis Lua
      # behavior so the broad suite cannot silently lose one side of the cross-store boundary.
      - name: Tenant Redis purge memory contract (must execute)
        run: pnpm run test:tenant-redis-purge-memory

      - name: Tenant Redis purge real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
          REDIS_TEST_URL: redis://127.0.0.1:6379/1
        run: pnpm run test:tenant-redis-purge-mysql

      - name: Tenant Redis purge real Redis suite (must execute)
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/1
        run: pnpm run test:tenant-redis-purge-redis

      # Canonical policy activation and legal holds are destructive-work authority boundaries.
      # Keep explicit real-InnoDB proof for CAS, rollback, audit integrity and request/anonymize races.
      - name: Retention policy and legal hold real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:retention-policy-mysql

      # Evaluation is a non-destructive but security-sensitive authority boundary. Prove its
      # request binding, deadline calculations, hold ABA invalidation and rollback on real InnoDB.
      - name: Erasure purge-policy evaluation real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:erasure-purge-policy-mysql

      # The erasure queue is an authority boundary: exact lease expiry, stale-worker CAS, audit
      # atomicity and subject completion all require explicit no-skip evidence against real MySQL.
      - name: Erasure job queue real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:erasure-job-mysql

      # The privileged session path must never degrade into a generic content upsert. Keep explicit
      # real-MySQL proof for claim-bound fencing, fixed settlement, rollback and tombstone/outbox CAS.
      - name: Erasure session actions real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:erasure-session-mysql

      # Enumeration is the deletion worker's completeness proof. Exercise phase-bound authority,
      # keyset scans, child-first leaves and usage-owner corruption against real MySQL with no skips.
      - name: Erasure session catalog real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:erasure-catalog-mysql

      # Usage verification is only safe when the worker claim and every possible financial write
      # share one transaction. Prove stale/ABA claims and late conflicts roll back on real MySQL.
      - name: Claim-bound erasure usage real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:erasure-usage-mysql

      # Generation-zero compensation crosses the irreversible cutover, queue authority and final
      # tombstone publication boundaries. Keep a named no-skip proof for real InnoDB rollback/ABA.
      - name: Legacy tombstone compensation real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:legacy-tombstone-mysql

      # User export combines owner isolation, repeatable-read snapshotting, build leases, download
      # leases and exact-identity cleanup. Keep a named no-skip proof against real InnoDB.
      - name: User data export real MySQL suite (must execute)
        env:
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:user-data-export-mysql

      # These are historical-database upgrades, not fresh-schema tests. The 0007 through 0027
      # baselines used by each upgrade are frozen SQL snapshots; the wrapper rejects any
      # missing/skipped fixture, including the 0014 -> 0015 policy/hold, 0015 -> 0016
      # purge-policy authority, 0016 -> 0017 user-export and 0018 -> 0019 inert tenant credential
      # revocation substrate, 0019 -> 0020 runtime-proof, 0020 -> 0021 content-inventory and
      # 0021 -> 0022 full-domain purge-plan, 0022 -> 0023 execution-ledger and 0023 -> 0024
      # database-content deletion, 0024 -> 0025 Redis-purge ledger, 0025 -> 0026 versioned
      # credential-lifecycle inventory and 0026 -> 0027 blob-storage control replay matrices.
      - name: Historical MySQL migrations (0007 through 0027, no skips)
        env:
          MYSQL_MIGRATION_TEST_URL: mysql://root@127.0.0.1:3306/agent_service_test
        run: pnpm run test:migrations

      - name: Cluster tests (real processes)
        env:
          AGENT_SERVICE_CLUSTER: "1"
          CLUSTER_MYSQL_URL: mysql://root@127.0.0.1:3306/agent_service_cluster
          CLUSTER_REDIS_URL: redis://127.0.0.1:6379/3
        run: pnpm vitest run test/cluster

      # Parse an exact JSON report in addition to the broad cluster run. This proves the T3g
      # mixed-worker, mixed-namespace and active-fleet rollout matrix ran with zero skipped cases.
      - name: Tenant Redis purge cluster rollout suite (must execute)
        env:
          CLUSTER_MYSQL_URL: mysql://root@127.0.0.1:3306/agent_service_cluster
          CLUSTER_REDIS_URL: redis://127.0.0.1:6379/3
        run: pnpm run test:tenant-redis-purge-cluster

      - name: Build distributable artifacts and boot plain Node bundles
        run: pnpm run build:check

      # Start the production-shaped bundles against a throwaway MySQL schema and the real MinIO
      # process above. This proves the bundled AWS SDK closure, migration 0027 activation and exact
      # fleet namespace negotiation at the application wiring boundary; object-store credentials
      # are scoped to this step and the smoke passes them only to the runner child.
      - name: S3 bundled runner/router application assembly smoke (must execute)
        env:
          AGENT_SERVICE_APP_SMOKE_MODE: dist
          MYSQL_APP_SMOKE_URL: mysql://root@127.0.0.1:3306/agent_service_test
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_REGION: us-east-1
          S3_TEST_BUCKET: agent-service-ci-test
          S3_TEST_ACCESS_KEY_ID: agentservice-ci
          S3_TEST_SECRET_ACCESS_KEY: agent-service-ci-minio-only-0001
          S3_TEST_FORCE_PATH_STYLE: "1"
        run: pnpm run test:app-s3-smoke

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The production image is part of the contract, so it is built and started here. Every one of the
  # Dockerfile defects found in review was invisible precisely because CI never did this.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [agent-runner, agent-router]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: agent_service
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: APP=${{ matrix.app }}
          tags: agent-service/${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that starts but is unreachable, or reports healthy on the wrong port, is the exact
      # failure mode this step exists to catch.
      - name: Run the container and reach it from outside
        run: |
          set -euo pipefail
          if [ "${{ matrix.app }}" = "agent-runner" ]; then
            docker run -d --name app --network host \
              -e SECRETS_MASTER_KEY=$SECRETS_MASTER_KEY \
              -e INTERNAL_ROUTER_TOKEN=ci-internal-router-token-00000001 \
              -e STORE=mysql -e MYSQL_URL=mysql://root@127.0.0.1:3306/agent_service \
              -e REDIS_URL=redis://127.0.0.1:6379 \
              -e ADMIN_BOOTSTRAP_TENANT=t_ci \
              -e RUNNER_ADDR=127.0.0.1:8787 -e RUNNER_PORT=8787 \
              agent-service/${{ matrix.app }}:ci
            PORT=8787
          else
            docker run -d --name app --network host \
              -e INTERNAL_ROUTER_TOKEN=ci-internal-router-token-00000001 \
              -e RUNNERS=http://127.0.0.1:8787 -e ROUTER_PORT=8080 \
              agent-service/${{ matrix.app }}:ci
            PORT=8080
          fi
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then echo "reachable on $PORT"; break; fi
            if [ "$i" = "60" ]; then echo "never became reachable"; docker logs app; exit 1; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/openapi.json" | grep -q '"openapi":"3.1.0"'
          # Docker's own healthcheck must agree, which is what catches a wrong port in HEALTHCHECK.
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            if [ "$i" = "40" ]; then echo "healthcheck says $status"; docker logs app; exit 1; fi
            sleep 2
          done
          # And the runner must have applied its migrations from inside the image.
          if [ "${{ matrix.app }}" = "agent-runner" ]; then
            mysql -h 127.0.0.1 -uroot agent_service -e "select name from schema_migrations" | grep -q 0027_blob_storage_control.sql
            # Exercise the production-safe one-time bootstrap path. Do not weaken the production
            # guard by injecting BOOTSTRAP_API_KEY (that variable is intentionally development-only).
            CI_KEY=$(docker logs app 2>&1 | sed -n 's/^  \(ask_[A-Za-z0-9_-]*\)$/\1/p' | tail -n 1)
            if [ -z "$CI_KEY" ]; then echo "production admin bootstrap did not emit a key"; docker logs app; exit 1; fi
            curl -fsS -X POST http://127.0.0.1:8787/v1/agents \
              -H "Authorization: Bearer $CI_KEY" -H 'X-User-Id: u1' -H 'content-type: application/json' \
              -d '{"name":"ci","instructions":"x","model":{"provider":"dashscope","model":"qwen-plus"}}' >/dev/null
          fi
          docker rm -f app
