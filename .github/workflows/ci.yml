      - name: Write pinned Redis AOF fixture payload (part 1)
        if: matrix.app == 'agent-runner'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY_B_AOF_DATA'
          import hashlib,os,pathlib,re,stat
          os.umask(0o077)
          if not __debug__:raise RuntimeError('optimized_python_refused')
          r=os.environ['GITHUB_RUN_ID'];a=os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch('[1-9][0-9]*',r) and re.fullmatch('[1-9][0-9]*',a)
          p=pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)/('production-b-aof-payload-'+r+'-'+a)
          p.mkdir(mode=0o700,exist_ok=False)
          s=p.lstat();assert p.resolve(strict=True)==p and stat.S_ISDIR(s.st_mode) and s.st_uid==os.getuid() and stat.S_IMODE(s.st_mode)==0o700
          data=''.encode('ascii')
          assert len(data)==17682 and hashlib.sha256(data).hexdigest()=='011930ba38a3b2136c8188d00fc30843bdba1a9643506063bf8a5e6e2bef31cc'
          fd=os.open(p/'part-1.base64',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          try:
           with os.fdopen(fd,'wb',closefd=False) as f:f.write(data);f.flush();os.fsync(fd)
          finally:os.close(fd)
          fd=os.open(p,os.O_RDONLY|os.O_DIRECTORY);os.fsync(fd);os.close(fd)
          PY_B_AOF_DATA

      - name: Write pinned Redis AOF fixture payload (part 2)
